[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhdocparser"
version = "0.3.0"
description = "Chinese document parser that converts PDF and DOCX into structured Markdown, JSON, and RAG-friendly chunks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "xt765" }
]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "httpx>=0.27,<1",
]

[project.scripts]
zhdocparser = "zhdocparser.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["zhdocparser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
